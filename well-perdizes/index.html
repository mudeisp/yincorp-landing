<script>
document.getElementById('leadForm').addEventListener('submit', function(e){
  e.preventDefault();
  var nome = document.getElementById('nome').value;
  var email = document.getElementById('email').value;
  var telefone = document.getElementById('telefone').value;

  // Envio ao CRM Praedium
  fetch('https://api.praedium.com.br/v1/12052/eff285d6-a704-11f1-b277-0affe18deec3/conversion?access_token=2e1b0a3576408d4e14780289654053fbb99ad2c023c19785d4a81658d355d77c', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome: nome, email: email, telefone: telefone })
  });

  // Eventos de conversão
  if (typeof fbq !== 'undefined') fbq('track', 'Lead');
  if (typeof gtag !== 'undefined') gtag('event', 'generate_lead');

  // Abre o WhatsApp com a mensagem preenchida
  var msg = encodeURIComponent('Olá! Meu nome é ' + nome + ' e tenho interesse no Well Perdizes. E-mail: ' + email + ' · Telefone: ' + telefone);
  window.open('https://wa.me/5511992976368?text=' + msg, '_blank');
});
</script>
