    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;

            --text-white: #FFFFFF;
            --text-muted: #A0A5B5;

            --whatsapp-hover: #1EBE57;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 100px; /* Espaço para o botão flutuante */
        }

        /* --- Container Principal --- */
        .main-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- Header: Logo à Esquerda --- */
        header {
            padding: 20px 0;
            display: flex;
            justify-content: flex-start; /* Alinha à esquerda */
            align-items: center;
            background: linear-gradient(180deg, rgba(18,23,34,0.9) 0%, rgba(10,13,20,0) 100%);
        }

        .logo-img {
            max-height: 70px; /* Tamanho ajustado para o canto */
            width: auto;
            display: block;
        }

        /* --- Títulos das Seções --- */
        .section-header {
            text-align: center;
            margin: 60px 0 30px;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            color: var(--gold-primary);
            margin-bottom: 10px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1em;
            font-weight: 300;
        }

        /* --- 1. Carrossel de Vídeos (2 YouTube dividindo a tela) --- */
        .video-carousel-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 15px;
            -webkit-overflow-scrolling: touch;
        }

        .video-carousel-container::-webkit-scrollbar { height: 6px; }
        .video-carousel-container::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

        .video-slide {
            flex: 0 0 calc(50% - 10px); /* 2 vídeos por tela menos o gap */
            scroll-snap-align: start;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--bg-card-border);
            position: relative;
        }

        /* Aspecto 16:9 para os vídeos */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Ajuste para Mobile (1 vídeo por tela) */
        @media (max-width: 768px) {
            .video-slide {
                flex: 0 0 90%;
            }
        }

        /* --- 2. Carrossel de 10 Imagens (Scroll Horizontal) --- */
        .image-carousel-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 10px 0 20px;
            -webkit-overflow-scrolling: touch;
        }

        .image-carousel-container::-webkit-scrollbar { height: 6px; }
        .image-carousel-container::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

        .image-slide {
            flex: 0 0 300px; /* Largura fixa das imagens */
            scroll-snap-align: center;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .image-slide:hover {
            border-color: var(--gold-primary);
        }

        .image-slide img {
            width: 100%;
            height: 200px; /* Altura fixa para alinhar */
            object-fit: cover;
            display: block;
        }

        /* Ajuste para Mobile */
        @media (max-width: 768px) {
            .image-slide {
                flex: 0 0 80%;
            }
        }

        /* --- 3. Botão do WhatsApp Flutuante com Foto dentro --- */
        .whatsapp-fixed {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--whatsapp-green);
            color: #FFFFFF;
            padding: 10px 25px 10px 10px; /* Espaço para a foto na esquerda */
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1em;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: 0.3s;
            z-index: 1000; /* Garante que fique por cima */
        }

        .whatsapp-fixed:hover {
            background-color: var(--whatsapp-hover);
            transform: translateY(-5px);
        }

        /* Container da Foto dentro do botão */
        .whatsapp-photo-container {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #FFFFFF; /* Borda branca elegante ao redor da foto */
            flex-shrink: 0;
        }

        .whatsapp-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garante que a foto preencha o círculo */
            display: block;
        }

        /* Ajuste para Mobile (reduz o tamanho) */
        @media (max-width: 768px) {
            .whatsapp-fixed {
                bottom: 20px;
                right: 20px;
                font-size: 0.95em;
                padding: 8px 18px 8px 8px;
            }
            .whatsapp-photo-container {
                width: 45px;
                height: 45px;
            }
        }

        /* Footer */
        footer {

            border-top: 1px solid rgba(212, 175, 55, 0.1);
            color: var(--text-muted);
            font-size: 0.85em;
            margin-top: 60px;
        }

        footer p.brand {
            color: var(--gold-primary);
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
